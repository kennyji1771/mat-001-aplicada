<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <!-- user-scalable=no evita conflictos con el zoom nativo; usamos zoom propio -->
  <title>SGO/P · NEXUS · Análisis de Reclamos Bancarios (Zoom táctil garantizado)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none; /* Evita selección de texto al arrastrar */
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0A0C12;
      color: #FFFFFF;
      height: 100vh;
      overflow: hidden;
      background-image: radial-gradient(circle at 25% 40%, rgba(0, 163, 255, 0.08) 0%, transparent 65%);
      touch-action: pan-x pan-y; /* permite desplazamiento vertical/horizontal básico */
    }

    .nexus-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: rgba(8, 12, 20, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 163, 255, 0.4);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nexus-logo {
      height: 38px;
      width: auto;
      filter: drop-shadow(0 0 6px rgba(0, 163, 255, 0.4));
    }

    .presentation-title {
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 0.2px;
      color: #E0E0E0;
      border-left: 1px solid rgba(255,255,255,0.2);
      padding-left: 16px;
      line-height: 1.3;
    }

    .presentation-title small {
      font-size: 0.75rem;
      color: #80C0E0;
      display: block;
    }

    .slide-indicator {
      background: rgba(0, 163, 255, 0.2);
      padding: 6px 14px;
      border-radius: 30px;
      border: 1px solid rgba(0, 163, 255, 0.5);
      font-size: 0.85rem;
      font-weight: 600;
      color: #B0D4F0;
    }

    .presentation-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding-top: 70px;
      padding-bottom: 90px;
      overflow: hidden;
      position: relative;
    }

    .slide-track {
      width: 100%;
      height: 100%;
      display: flex;
      transition: transform 0.3s ease-out;
      will-change: transform;
    }

    .slide-wrapper {
      flex: 0 0 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden; /* El zoom se manejará dentro del contenedor de imagen */
      position: relative;
      background: #0F1119;
    }

    /* Contenedor de zoom y pan para cada imagen */
    .zoom-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none; /* Desactiva scroll nativo para permitir zoom táctil manual */
      cursor: grab;
    }
    .zoom-container:active {
      cursor: grabbing;
    }

    .zoom-img {
      display: block;
      max-width: 90%;
      max-height: 90%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      transition: transform 0.05s linear;
      will-change: transform;
      pointer-events: none; /* Los eventos los maneja el contenedor */
    }

    /* Botones de zoom específicos para cada slide (se muestran en la barra inferior) */
    .zoom-controls {
      position: fixed;
      bottom: 90px;
      right: 20px;
      z-index: 45;
      display: flex;
      gap: 10px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 40px;
      border: 1px solid rgba(0,163,255,0.5);
    }
    .zoom-btn {
      background: #1e2a3a;
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 30px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .zoom-btn:hover {
      background: #00A3FF;
      transform: scale(1.05);
    }
    .reset-zoom-btn {
      background: #2c3e4e;
    }

    /* Barra inferior normal */
    .nav-controls {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 40;
      flex-wrap: wrap;
      padding: 0 16px;
    }

    .nav-btn, .download-btn, .grid-btn, .fullscreen-btn-bottom {
      background: rgba(12, 20, 30, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 163, 255, 0.5);
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
      touch-action: manipulation;
    }

    .nav-btn:hover, .download-btn:hover, .grid-btn:hover, .fullscreen-btn-bottom:hover {
      background: #00A3FF;
      border-color: #00A3FF;
      transform: scale(1.05);
      color: #0B0E14;
    }

    .counter {
      background: rgba(8, 12, 20, 0.85);
      backdrop-filter: blur(12px);
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      border: 1px solid rgba(0, 163, 255, 0.4);
      box-shadow: 0 8px 18px rgba(0,0,0,0.3);
      user-select: none;
    }

    .thumbnails-panel {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8, 12, 20, 0.95);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 12px;
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      z-index: 70;
      border: 1px solid rgba(0, 163, 255, 0.5);
      max-width: 90%;
      max-height: 60%;
      overflow-y: auto;
    }

    .thumbnails-panel.active {
      display: grid;
    }

    .thumbnail {
      width: 70px;
      height: 50px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: 0.1s;
    }

    .thumbnail:hover, .thumbnail.active-thumb {
      border-color: #00A3FF;
      transform: scale(1.02);
    }

    .nexus-footer {
      position: fixed;
      bottom: 12px;
      left: 16px;
      z-index: 35;
      color: rgba(180, 210, 240, 0.6);
      font-size: 0.7rem;
      font-weight: 500;
      background: rgba(0,0,0,0.3);
      padding: 4px 10px;
      border-radius: 20px;
      pointer-events: none;
    }

    /* Fullscreen overrides */
    body:fullscreen .zoom-img,
    body:-webkit-full-screen .zoom-img,
    body:-moz-full-screen .zoom-img {
      max-width: 100% !important;
      max-height: 100% !important;
      border-radius: 0;
      box-shadow: none;
    }
    body:fullscreen .nexus-header,
    body:-webkit-full-screen .nexus-header,
    body:-moz-full-screen .nexus-header,
    body:fullscreen .nav-controls,
    body:-webkit-full-screen .nav-controls,
    body:-moz-full-screen .nav-controls,
    body:fullscreen .zoom-controls,
    body:-webkit-full-screen .zoom-controls,
    body:-moz-full-screen .zoom-controls,
    body:fullscreen .nexus-footer {
      display: none !important;
    }
    body:fullscreen .presentation-container {
      padding: 0 !important;
    }

    @media (max-width: 600px) {
      .nexus-header { padding: 8px 16px; }
      .nexus-logo { height: 30px; }
      .presentation-title { font-size: 0.75rem; }
      .nav-btn, .download-btn, .grid-btn, .fullscreen-btn-bottom { width: 44px; height: 44px; font-size: 20px; }
      .counter { padding: 6px 16px; font-size: 0.85rem; }
      .thumbnail { width: 55px; height: 40px; }
      .zoom-controls { bottom: 90px; right: 10px; }
      .zoom-btn { width: 36px; height: 36px; font-size: 18px; }
    }
  </style>
</head>
<body>

<div class="progress-bar" id="progressBar"></div>

<header class="nexus-header">
  <div class="header-left">
    <img class="nexus-logo" src="img/nexus-logo.png" alt="NEXUS - Órgano Defensa Integral">
    <div class="presentation-title">
      SGO/P · NEXUS
      <small>Análisis de Reclamos Bancarios . UNEXCA Prof: LEOMAR VALECILLOS GUERRA</small>
    </div>
  </div>
  <div class="header-right">
    <span class="slide-indicator" id="headerSlideIndicator">1 / 12</span>
  </div>
</header>

<div class="presentation-container">
  <div class="slide-track" id="slideTrack"></div>
  <div class="loader" id="loader"></div>
</div>

<div class="thumbnails-panel" id="thumbnailsPanel"></div>

<div class="nav-controls">
  <div class="nav-btn" id="prevBtn" title="Anterior">◀</div>
  <div class="counter" id="counter">1 / 12</div>
  <div class="nav-btn" id="nextBtn" title="Siguiente">▶</div>
  <div class="fullscreen-btn-bottom" id="fullscreenBtn" title="Pantalla completa">⛶</div>
  <div class="grid-btn" id="gridBtn" title="Miniaturas">▦</div>
  <div class="download-btn" id="downloadSlideBtn" title="Descargar diapositiva PNG">⬇</div>
</div>

<div class="zoom-controls">
  <button class="zoom-btn" id="zoomInBtn" title="Acercar">+</button>
  <button class="zoom-btn reset-zoom-btn" id="zoomResetBtn" title="Restablecer zoom">⟳</button>
  <button class="zoom-btn" id="zoomOutBtn" title="Alejar">−</button>
</div>

<div class="nexus-footer">NEXUS · KENNY SIEVERES · Zoom táctil activo</div>

<!-- Enlaces de descarga completos -->
<div style="display: none;">
  <a id="pdfDownloadLink" href="#" target="_blank">PDF</a>
  <a id="pptxDownloadLink" href="#" target="_blank">PPTX</a>
</div>

<script>
  (function(){
    const TOTAL_SLIDES = 12;
    let currentIdx = 0;
    let slidesData = [];
    let preloadedImages = [];

    // Variables para el zoom/pan de la imagen activa
    let activeZoomContainer = null;
    let activeImg = null;
    let activeTransform = { scale: 1, translateX: 0, translateY: 0 };
    let initialDistance = 0;
    let initialScale = 1;
    let lastTouchX = 0, lastTouchY = 0;
    let isPanning = false;
    let panStartX = 0, panStartY = 0;
    let panStartTranslateX = 0, panStartTranslateY = 0;

    const track = document.getElementById('slideTrack');
    const loader = document.getElementById('loader');
    const counterEl = document.getElementById('counter');
    const headerIndicator = document.getElementById('headerSlideIndicator');
    const progressBar = document.getElementById('progressBar');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fullBtn = document.getElementById('fullscreenBtn');
    const gridBtn = document.getElementById('gridBtn');
    const downloadSlideBtn = document.getElementById('downloadSlideBtn');
    const thumbPanel = document.getElementById('thumbnailsPanel');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomResetBtn = document.getElementById('zoomResetBtn');

    // Carga imágenes
    function getImageUrl(slideNumber, callback) {
      const padded = slideNumber.toString().padStart(2, '0');
      const urlPng = `img/slide-${padded}.png`;
      const urlPngMayus = `img/slide-${padded}.PNG`;
      const testImg = new Image();
      testImg.onload = () => callback(urlPng);
      testImg.onerror = () => {
        const testImg2 = new Image();
        testImg2.onload = () => callback(urlPngMayus);
        testImg2.onerror = () => callback(null);
        testImg2.src = urlPngMayus;
      };
      testImg.src = urlPng;
    }

    function preloadAllSlides(callback) {
      let loaded = 0;
      for (let i = 1; i <= TOTAL_SLIDES; i++) {
        getImageUrl(i, (url) => {
          slidesData[i-1] = url;
          if (url) {
            const img = new Image();
            img.src = url;
            preloadedImages.push(img);
          }
          loaded++;
          if (loaded === TOTAL_SLIDES) callback();
        });
      }
    }

    // Aplica transformación a la imagen activa
    function applyTransform() {
      if (!activeImg) return;
      const { scale, translateX, translateY } = activeTransform;
      activeImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      activeImg.style.transition = 'transform 0.05s linear';
    }

    // Restablecer zoom y posición
    function resetZoom() {
      activeTransform = { scale: 1, translateX: 0, translateY: 0 };
      applyTransform();
    }

    function zoomIn() {
      activeTransform.scale = Math.min(activeTransform.scale * 1.2, 5);
      applyTransform();
    }
    function zoomOut() {
      activeTransform.scale = Math.max(activeTransform.scale / 1.2, 0.8);
      applyTransform();
    }

    // Configurar eventos táctiles para zoom pinch y pan en un contenedor
    function setupZoomPanForSlide(container, img) {
      container.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touches = e.touches;
        if (touches.length === 2) {
          // Pinch: dos dedos
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          initialDistance = Math.hypot(dx, dy);
          initialScale = activeTransform.scale;
          isPanning = false;
        } else if (touches.length === 1) {
          // Pan: un dedo
          isPanning = true;
          panStartX = touches[0].clientX;
          panStartY = touches[0].clientY;
          panStartTranslateX = activeTransform.translateX;
          panStartTranslateY = activeTransform.translateY;
        }
      });

      container.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touches = e.touches;
        if (touches.length === 2 && initialDistance > 0) {
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          const newDistance = Math.hypot(dx, dy);
          let scaleDelta = newDistance / initialDistance;
          let newScale = initialScale * scaleDelta;
          newScale = Math.min(Math.max(newScale, 0.8), 5);
          activeTransform.scale = newScale;
          applyTransform();
        } else if (touches.length === 1 && isPanning) {
          const deltaX = touches[0].clientX - panStartX;
          const deltaY = touches[0].clientY - panStartY;
          activeTransform.translateX = panStartTranslateX + deltaX;
          activeTransform.translateY = panStartTranslateY + deltaY;
          applyTransform();
        }
      });

      container.addEventListener('touchend', (e) => {
        initialDistance = 0;
        isPanning = false;
      });
    }

    // Construir slides con zoom container
    function buildTrack() {
      track.innerHTML = '';
      for (let i = 0; i < TOTAL_SLIDES; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'slide-wrapper';
        const zoomDiv = document.createElement('div');
        zoomDiv.className = 'zoom-container';
        const img = document.createElement('img');
        img.className = 'zoom-img';
        img.alt = `Diapositiva ${i+1}`;
        if (slidesData[i]) img.src = slidesData[i];
        else img.src = '';
        zoomDiv.appendChild(img);
        wrapper.appendChild(zoomDiv);
        track.appendChild(wrapper);
      }
      updateSlidePosition(false);
      // Activar zoom/pan para el slide actual y para los futuros al cambiar
      refreshActiveZoom();
    }

    function refreshActiveZoom() {
      const currentWrapper = track.children[currentIdx];
      if (!currentWrapper) return;
      const container = currentWrapper.querySelector('.zoom-container');
      const img = currentWrapper.querySelector('.zoom-img');
      if (container && img) {
        activeZoomContainer = container;
        activeImg = img;
        resetZoom(); // resetear zoom al cambiar de slide
        // Reasignar eventos si ya existían, evitando duplicados
        // (eliminamos listeners antiguos con clone? mejor limpiar y agregar nuevos)
        // Para simplificar, clonamos el contenedor? Mejor removemos y volvemos a agregar.
        const newContainer = container.cloneNode(true);
        container.parentNode.replaceChild(newContainer, container);
        activeZoomContainer = newContainer;
        activeImg = newContainer.querySelector('.zoom-img');
        resetZoom();
        setupZoomPanForSlide(activeZoomContainer, activeImg);
      }
    }

    function updateSlidePosition(animated = true) {
      if (!animated) track.style.transition = 'none';
      track.style.transform = `translateX(-${currentIdx * 100}%)`;
      if (!animated) setTimeout(() => track.style.transition = '', 50);
      
      const slideNum = currentIdx + 1;
      counterEl.textContent = `${slideNum} / ${TOTAL_SLIDES}`;
      headerIndicator.textContent = `${slideNum} / ${TOTAL_SLIDES}`;
      const percent = (slideNum / TOTAL_SLIDES) * 100;
      progressBar.style.width = `${percent}%`;
      
      document.querySelectorAll('.thumbnail').forEach((thumb, idx) => {
        if (idx === currentIdx) thumb.classList.add('active-thumb');
        else thumb.classList.remove('active-thumb');
      });
      // Reinicializar zoom/pan para la nueva slide
      refreshActiveZoom();
    }

    function goToSlide(index) {
      if (index < 0) index = TOTAL_SLIDES - 1;
      if (index >= TOTAL_SLIDES) index = 0;
      if (index === currentIdx) return;
      currentIdx = index;
      updateSlidePosition(true);
    }
    function nextSlide() { goToSlide(currentIdx + 1); }
    function prevSlide() { goToSlide(currentIdx - 1); }

    function buildThumbnails() {
      thumbPanel.innerHTML = '';
      for (let i = 0; i < TOTAL_SLIDES; i++) {
        const thumb = document.createElement('img');
        thumb.className = 'thumbnail';
        thumb.src = slidesData[i] || '';
        thumb.alt = `Miniatura ${i+1}`;
        thumb.addEventListener('click', () => {
          goToSlide(i);
          thumbPanel.classList.remove('active');
        });
        thumbPanel.appendChild(thumb);
      }
    }

    function downloadCurrentSlide() {
      const currentImg = track.children[currentIdx]?.querySelector('.zoom-img');
      if (!currentImg || !currentImg.src) {
        alert('No se pudo descargar la imagen');
        return;
      }
      const link = document.createElement('a');
      link.download = `diapositiva_${currentIdx+1}_nexus.png`;
      link.href = currentImg.src;
      link.click();
    }

    function toggleFullscreen() {
      const docEl = document.documentElement;
      const reqFull = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      const exitFull = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
      if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
        if (reqFull) reqFull.call(docEl).catch(e => console.warn(e));
      } else {
        if (exitFull) exitFull.call(document);
      }
    }

    function setupExternalDownloads() {
      const PDF_URL = "#";   // Cambiar por enlace real
      const PPTX_URL = "#";
      const pdfLink = document.getElementById('pdfDownloadLink');
      const pptxLink = document.getElementById('pptxDownloadLink');
      if (pdfLink) pdfLink.href = PDF_URL;
      if (pptxLink) pptxLink.href = PPTX_URL;
    }

    // Event listeners
    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);
    fullBtn.addEventListener('click', toggleFullscreen);
    downloadSlideBtn.addEventListener('click', downloadCurrentSlide);
    gridBtn.addEventListener('click', () => thumbPanel.classList.toggle('active'));
    document.addEventListener('click', (e) => {
      if (!thumbPanel.contains(e.target) && e.target !== gridBtn) thumbPanel.classList.remove('active');
    });
    zoomInBtn.addEventListener('click', zoomIn);
    zoomOutBtn.addEventListener('click', zoomOut);
    zoomResetBtn.addEventListener('click', resetZoom);

    // Swipe para cambiar slide (solo cuando no hay zoom activo, se puede mejorar)
    let touchStartX = 0, touchStartY = 0;
    document.addEventListener('touchstart', (e) => {
      // Solo si no hay toques dentro del zoom container (evitar conflictos)
      if (e.target.closest('.zoom-container')) return;
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, {passive: false});
    document.addEventListener('touchend', (e) => {
      if (e.target.closest('.zoom-container')) return;
      const deltaX = e.changedTouches[0].screenX - touchStartX;
      const deltaY = e.changedTouches[0].screenY;
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
        deltaX < 0 ? nextSlide() : prevSlide();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
      else if (e.key === 'Home') { e.preventDefault(); goToSlide(0); }
      else if (e.key === 'End') { e.preventDefault(); goToSlide(TOTAL_SLIDES-1); }
      else if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
    });

    preloadAllSlides(() => {
      buildTrack();
      buildThumbnails();
      updateSlidePosition(false);
      setupExternalDownloads();
    });
  })();
</script>
</body>
</html>
